name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Find and select Xcode with iOS SDK
        run: |
          # List available Xcode versions
          ls /Applications/ | grep Xcode
          # Use latest available Xcode
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -showsdks | grep -i ios

      - name: Install pinned llama.cpp XCFramework
        run: |
          test "$(git rev-parse HEAD:llama.cpp)" = "4d828bd1ab52773ba9570cc008cf209eb4a8b2f5"
          curl --fail --location --retry 3 --output llama-xcframework.zip \
            https://github.com/ggml-org/llama.cpp/releases/download/b8189/llama-b8189-xcframework.zip
          echo "eb535c182767be4ab362720cc997273da87e6cbc2a3b0f98f2ff958dc5f30c67  llama-xcframework.zip" | shasum -a 256 -c -
          unzip -q llama-xcframework.zip -d llama.cpp
          test -f llama.cpp/build-apple/llama.xcframework/Info.plist

      - name: Build iOS app
        run: |
          xcodebuild build \
            -project llama.swiftui.xcodeproj \
            -scheme llama.swiftui \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath build

      - name: Package IPA
        run: |
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r CrucibleLLM.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CrucibleLLM
          path: CrucibleLLM.ipa
